name: pos_billingwala_v2
description: "Billingwala Version 2 - Flutter POS for Android, iOS, and Web"
publish_to: 'none'
version: 2.0.1+76

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  qr: ^3.0.2
  share_plus: ^13.3.0
  print_bluetooth_thermal: ^1.2.4
  permission_handler: ^13.0.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  unified_esc_pos_printer: ^3.4.0
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.2
  gal: ^2.3.3
  pointycastle: ^4.0.0
  asn1lib: ^1.6.5
  image_picker: ^1.2.3
  flutter_svg: ^2.3.0
  flutter_launcher_icons: ^0.14.4
  in_app_update: ^5.0.0
  pinput: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

# unified_esc_pos_printer accepts 0.1.x or 1.x. Pin 0.1.2 (Flutter FFI plugin)
# so web/Chrome builds skip the 1.x native-assets hook, which crashes the Dart
# VM on these Windows toolchain (ACCESS_VIOLATION during hook execution).
dependency_overrides:
  libserialport_plus: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/png/
    - assets/images/svg/
    - assets/font/
    - assets/locale/
    - assets/payment_display/
    - assets/payment_display/css/
    - assets/payment_display/js/
    - assets/license_signing_public.pem
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/poppinslight.ttf
          weight: 300
        - asset: assets/font/poppinsregular.ttf
          weight: 400
        - asset: assets/font/poppinsitalic.ttf
          weight: 400
          style: italic
        - asset: assets/font/poppinsmedium.ttf
          weight: 500
        - asset: assets/font/poppinsbold.ttf
          weight: 700
        - asset: assets/font/poppinsblack.ttf
          weight: 900
