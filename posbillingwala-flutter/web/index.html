<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="POS Billingwala — Flutter POS for Android, iOS, and Web">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="POS Billingwala">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>POS Billingwala</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0756C9;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    #startup {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #fff;
      z-index: 9999;
      background: #0756C9;
    }
    #startup .mark {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    #startup .bar {
      margin-top: 22px;
      width: 160px;
      height: 4px;
      border-radius: 4px;
      background: rgba(255,255,255,.28);
      overflow: hidden;
    }
    #startup .bar > span {
      display: block;
      height: 100%;
      width: 40%;
      background: #fff;
      animation: load 1s ease-in-out infinite;
    }
    @keyframes load {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="startup">
    <div class="mark">Billingwala</div>
    <div class="bar"><span></span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('startup');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
