plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
}

android {
    compileSdk 37
    namespace 'com.pos_billingwala'

    defaultConfig {
        vectorDrawables.useSupportLibrary = true
        applicationId "com.pos_billingwala"
        minSdk 26
        targetSdk 37
        versionCode 71
        versionName "2.0.55"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"http://posbillingwala.com/androidApp/\""
        buildConfigField "String", "MEDIA_BASE_URL", "\"http://posbillingwala.com/storage/app/\""
        // true = allow screenshots/recording on every screen (activities + fragments). Set false for production.
        buildConfigField "boolean", "ALLOW_SCREENSHOT", "true"
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.android.material:material:1.14.0'
    //ImageView Dynamic
    implementation 'com.squareup.picasso:picasso:2.71828'
    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.0'
    //Circular Imageview
    implementation 'com.github.siyamed:android-shape-imageview:0.9.3@aar'
    //Permission
    implementation 'com.karumi:dexter:6.2.3'
    implementation 'com.airbnb.android:lottie:6.7.1'
    //To update google play store app
    implementation 'com.google.android.play:asset-delivery:2.3.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.gms:play-services-tasks:18.4.1'
    //Spinner
    implementation 'com.jaredrummler:material-spinner:1.3.1'
    //Sweetalert Dialog
    implementation 'com.github.f0ris.sweetalert:library:1.6.2'
    //Bluetooth SDK
    implementation files('libs/bluetooth.jar')
    implementation files('libs/btsdk.jar')
    implementation files('libs/WoosimLib240.jar')
    //Month, Year Dialog
    implementation 'com.github.dewinjm:monthyear-picker:1.0.2'
    //Circular Imageview
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    //Firebase SDK
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-perf'
    //Google ads SDK
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    //Excel
    implementation 'org.apache.poi:poi:5.5.1'
    //Mess QR token scan + generate
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Charts for sales dashboard
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

}