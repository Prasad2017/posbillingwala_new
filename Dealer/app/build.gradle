plugins {
    id 'com.android.application'
}

android {
    compileSdk 37
    namespace 'com.posbillingwala.dealer'
    defaultConfig {
        applicationId "com.posbillingwala.dealer"
        minSdk 26
        targetSdk 37
        versionCode 12
        versionName "1.0.10"
        multiDexEnabled true
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        // Testing against dev host (switch back to www for production)
        buildConfigField "String", "API_BASE_URL", "\"http://dev.posbillingwala.com/androidApp/Dealer/\""
        // true = allow screenshots/recording on every screen. Set false for production.
        buildConfigField "boolean", "ALLOW_SCREENSHOT", "true"
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        incremental true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
    }


}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    //ImageView Dynamic
    implementation 'com.squareup.picasso:picasso:2.71828'
    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.0'
    //Permission
    implementation 'com.karumi:dexter:6.2.3'
    implementation 'com.airbnb.android:lottie:6.7.1'
    //Spinner
    implementation 'com.jaredrummler:material-spinner:1.3.1'
    //Sweetalert Dialog
    implementation 'com.github.f0ris.sweetalert:library:1.6.2'
    //Month, Year Dialog
    implementation 'com.github.dewinjm:monthyear-picker:1.0.2'
    //Circular Imageview
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    //Google ads SDK
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    //To update google play store app
    implementation 'com.google.android.play:asset-delivery:2.3.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.gms:play-services-tasks:18.4.1'

}