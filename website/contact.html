<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Contact POS Billingwala — demos, licence enquiries, dealer partnerships, and support.">
  <link rel="icon" href="assets/images/app_logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/pos_billingwala_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <title>Contact — POS Billingwala</title>
</head>
<body data-pbw-page="contact">
  <div class="page-bg" aria-hidden="true"></div>
  <div id="pbw-header"></div>
  <main>
    <section class="page-hero"><div class="container reveal">
      <div class="page-hero-icon"><span data-pbw-icon="mail" data-pbw-tone="blue" data-pbw-size="26"></span></div>
      <p class="page-kicker">Contact</p>
      <h1>Talk to our team</h1>
      <p class="page-hero-lead">Licence enquiries, demos, dealer partnerships, printer &amp; roll orders — we will get back to you.</p>
    </div></section>
    <section class="section"><div class="container contact-grid">
      <div class="section-head reveal">
        <h2>Official contact</h2>
        <ul class="contact-meta">
          <li><span data-pbw-icon="phone" data-pbw-tone="green" data-pbw-sm></span><div class="contact-meta-content"><small>Phone</small><span id="contactPhone"><a href="tel:">—</a></span></div></li>
          <li><span data-pbw-icon="mail" data-pbw-tone="blue" data-pbw-sm></span><div class="contact-meta-content"><small>Email</small><span id="contactEmailDisplay"><a href="mailto:support@posbillingwala.com">support@posbillingwala.com</a></span></div></li>
          <li><span data-pbw-icon="building" data-pbw-tone="purple" data-pbw-sm></span><div class="contact-meta-content"><small>Hours</small><span id="contactHours">Mon–Sat, 10:00 AM – 7:00 PM IST</span></div></li>
        </ul>
        <p style="margin-top:1rem;"><a class="text-link" href="dealers.html">Find your local dealer →</a></p>
      </div>
      <form class="contact-form reveal" id="contactForm" novalidate>
        <div id="contactFeedback" class="contact-feedback" hidden role="status"></div>
        <div class="row-2">
          <input type="text" id="contactName" name="name" placeholder="Full name" required autocomplete="name">
          <input type="email" id="contactEmail" name="email" placeholder="Work email" required autocomplete="email">
        </div>
        <input type="text" id="contactSubject" name="subject" placeholder="Subject (Demo / Licence / Dealer / Support)">
        <textarea id="contactMessage" name="message" placeholder="City, business type, and how we can help" required></textarea>
        <button class="btn btn-primary btn-lg" type="submit" id="contactSubmit">Send message</button>
      </form>
    </div></section>
  </main>
  <div id="pbw-footer"></div>
  <script src="assets/js/site-config.js"></script>
  <script src="assets/js/site-icons.js"></script>
  <script src="assets/js/site-layout.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/site-tabs.js"></script>
  <script src="assets/js/site-content.js"></script>
  <script src="assets/js/site-contact.js"></script>
</body>
</html>
