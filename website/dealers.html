<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find your local POS Billingwala dealer — area-wise sales, installation, and support contacts.">
  <link rel="icon" href="assets/images/app_logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <title>Find Your Local Dealer — POS Billingwala</title>
</head>
<body data-pbw-page="dealers">
  <div class="page-bg" aria-hidden="true"></div>
  <div id="pbw-header"></div>
  <main>
    <section class="page-hero"><div class="container reveal">
      <p class="page-kicker">Dealer network</p>
      <h1>Find Your Local Dealer</h1>
      <p class="page-hero-lead">Area-wise authorized dealers and head office contacts for sales, installation, training, and renewal support.</p>
    </div></section>
    <section class="page-section"><div class="container">
      <div class="filter-bar reveal">
        <label for="dealerSearch">Search area</label>
        <input type="search" id="dealerSearch" placeholder="Pune, Satara, Mumbai, Karnataka…" autocomplete="off">
      </div>
      <div id="dealersRoot" class="dealers-grid"><p class="empty-note">Loading dealers…</p></div>
    </div></section>
  </main>
  <div id="pbw-footer"></div>
  <script src="assets/js/site-config.js"></script>
  <script src="assets/js/site-layout.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/site-content.js"></script>
</body>
</html>
